name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: pe_destinations_test
          MYSQL_USER: pe_test
          MYSQL_PASSWORD: pe_test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_root_password" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, bcmath, pdo_mysql, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: vendor/bin/pint --test

      - run: npm ci

      - run: npm run build

      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: pe_destinations_test
          DB_USERNAME: pe_test
          DB_PASSWORD: pe_test_password
